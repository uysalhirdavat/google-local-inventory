name: Yerel Envanteri Guncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yerel envanter XML olustur
        run: python convert.py

      - name: XML dosyasini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-inventory.xml
          git diff --cached --quiet || git commit -m "Yerel envanter otomatik guncellendi"
          git push
