name: Yerel Envanteri Guncelle

on:
  workflow_dispatch:
  push:
    paths:
      - convert.py
      - .github/workflows/update.yml
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yerel envanter XML olustur
        id: convert
        run: |
          python convert.py 2>&1 | tee /tmp/convert-output.log
          exit ${PIPESTATUS[0]}

      - name: XML dosyasini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-inventory.xml
          git diff --cached --quiet || git commit -m "Yerel envanter otomatik guncellendi"
          git push

      - name: Son calisma sonucunu kaydet
        if: always()
        env:
          CONVERT_STATUS: ${{ steps.convert.outcome }}
        run: |
          {
            echo "Tarih (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Donusturme sonucu: $CONVERT_STATUS"
            echo "Commit: $GITHUB_SHA"
            echo ""
            if [ -f /tmp/convert-output.log ]; then
              cat /tmp/convert-output.log
            else
              echo "Donusum log dosyasi olusmadi."
            fi
          } > local-inventory-last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-inventory-last-run.txt
          git diff --cached --quiet || git commit -m "Record local inventory conversion check"
          git push
